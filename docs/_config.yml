# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEwave
url: https://edgemodders.github.io
baseurl: /EDGEwave
repo: https://github.com/Edgemodders/EDGEwave

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Design
    url: /design.html
  - title: A1 Edit
    url: /a1-edit.html
  - title: A2 Mix
    url: /a2-mix.html
  - title: Dev setup
    url: /dev-setup.html
